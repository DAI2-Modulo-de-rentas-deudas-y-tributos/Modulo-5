name: Deploy backend AWS DEV

on:
  push:
    branches:
      - develop
    paths:
      - backend/**
      - .github/workflows/cd-backend-dev.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-dev
  cancel-in-progress: false

env:
  ECS_CLUSTER: "modulo-5-rentas-dev-cluster"
  ECS_SERVICE: "modulo-5-rentas-dev-backend"
  RDS_INSTANCE: "modulo-5-rentas-dev-postgres"

jobs:
  detect:
    name: detect-backend
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.backend.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect backend application
        id: backend
        shell: bash
        run: |
          if [[ -f backend/pom.xml ]]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "Backend application is not present; deployment is skipped."
          fi

  deploy:
    name: deploy-backend
    needs: detect
    if: needs.detect.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dev

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: "060712744495"
      ECR_REPOSITORY: "modulo-5-rentas-dev-backend"
      ECS_TASK_FAMILY: "modulo-5-rentas-dev-backend"
      ECS_CONTAINER_NAME: "backend"
      AMPLIFY_APP_NAME: "modulo-5-rentas-dev-frontend"
      AMPLIFY_BRANCH: "develop"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "060712744495"
          mask-aws-account-id: true
          role-session-name: backend-dev-${{ github.run_id }}

      - name: Check environment variables
        shell: bash
        run: |
          set -euo pipefail
          : "${AWS_REGION:?Missing AWS_REGION in the dev environment}"

      - name: Resolve DEV URLs
        id: frontend
        shell: bash
        run: |
          set -euo pipefail
          app_id=$(aws amplify list-apps \
            --query "apps[?name=='${AMPLIFY_APP_NAME}'].appId | [0]" \
            --output text)
          if [[ -z "${app_id}" || "${app_id}" == "None" ]]; then
            echo "Amplify app ${AMPLIFY_APP_NAME} was not found."
            exit 1
          fi
          default_domain=$(aws amplify get-app \
            --app-id "${app_id}" \
            --query 'app.defaultDomain' \
            --output text)
          if [[ -z "${default_domain}" || "${default_domain}" == "None" ]]; then
            echo "Amplify app does not expose a default domain."
            exit 1
          fi
          echo "origin=https://${AMPLIFY_BRANCH}.${default_domain}" >> "${GITHUB_OUTPUT}"
          api_base_url=$(aws amplify get-app \
            --app-id "${app_id}" \
            --query 'app.environmentVariables.VITE_API_BASE_URL' \
            --output text)
          if [[ -z "${api_base_url}" || "${api_base_url}" == "None" ]]; then
            echo "Amplify app does not expose VITE_API_BASE_URL."
            exit 1
          fi
          echo "api-base-url=${api_base_url}" >> "${GITHUB_OUTPUT}"

      - name: Login to Amazon ECR
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login \
                --username AWS \
                --password-stdin \
                "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Build and publish immutable image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_uri="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}"

          if aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${GITHUB_SHA}" > /dev/null 2>&1; then
            echo "Image already exists; reusing ${image_uri}."
          else
            docker build --pull --tag "${image_uri}" backend
            docker push "${image_uri}"
          fi

          echo "uri=${image_uri}" >> "${GITHUB_OUTPUT}"

      - name: Start DEV database
        shell: bash
        run: bash scripts/aws/runtime.sh db-start

      - name: Register task definition revision
        id: task
        shell: bash
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          FRONTEND_ORIGIN: ${{ steps.frontend.outputs.origin }}
        run: |
          set -euo pipefail

          aws ecs describe-task-definition \
            --task-definition "${ECS_TASK_FAMILY}" \
            --query taskDefinition \
            > "${RUNNER_TEMP}/task-definition.json"

          jq \
            --arg image "${IMAGE_URI}" \
            --arg container "${ECS_CONTAINER_NAME}" \
            --arg frontend_origin "${FRONTEND_ORIGIN}" \
            'del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            | (.containerDefinitions[] | select(.name == $container)) |= (
                .image = $image
                | .environment = (
                    ((.environment // []) | map(select(.name != "CORS_ALLOWED_ORIGINS")))
                    + [{name: "CORS_ALLOWED_ORIGINS", value: $frontend_origin}]
                  )
              )' \
            "${RUNNER_TEMP}/task-definition.json" \
            > "${RUNNER_TEMP}/task-definition-rendered.json"

          demo_mode=$(jq -r \
            --arg container "${ECS_CONTAINER_NAME}" \
            '.containerDefinitions[] | select(.name == $container)
             | (.environment // []) | map(select(.name == "RENTAS_SECURITY_DEV_MODE"))
             | first | .value // empty' \
            "${RUNNER_TEMP}/task-definition-rendered.json")

          if [[ -z "${demo_mode}" ]]; then
            echo "La definicion de tarea no declara RENTAS_SECURITY_DEV_MODE."
            echo "Terraform es la unica fuente de esa variable: aplicar infra/environments/dev antes de desplegar."
            echo "Sin ella el backend arranca saludable pero no expone /api/v1/dev-auth/*."
            exit 1
          fi
          echo "RENTAS_SECURITY_DEV_MODE=${demo_mode} heredado de la definicion administrada por Terraform."

          task_definition_arn=$(aws ecs register-task-definition \
            --cli-input-json "file://${RUNNER_TEMP}/task-definition-rendered.json" \
            --query taskDefinition.taskDefinitionArn \
            --output text)

          echo "arn=${task_definition_arn}" >> "${GITHUB_OUTPUT}"

      - name: Deploy service and wait until stable
        shell: bash
        env:
          TASK_DEFINITION_ARN: ${{ steps.task.outputs.arn }}
        run: |
          set -euo pipefail

          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${TASK_DEFINITION_ARN}" \
            --desired-count 1 \
            --force-new-deployment \
            > /dev/null

          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}"

          # El circuit breaker puede volver a la revision anterior y el servicio
          # queda estable igual: exigir que corra la revision recien registrada.
          read -r running_task_definition rollout_state <<< "$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --query 'services[0].deployments[0].[taskDefinition,rolloutState]' \
            --output text)"
          if [[ "${running_task_definition}" != "${TASK_DEFINITION_ARN}" || "${rollout_state}" != "COMPLETED" ]]; then
            echo "ECS no quedo con la revision nueva (${running_task_definition}, ${rollout_state}); probable rollback."
            exit 1
          fi

      - name: Smoke test through CloudFront
        shell: bash
        env:
          API_BASE_URL: ${{ steps.frontend.outputs.api-base-url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 15 --retry-all-errors --max-time 10 \
            "${API_BASE_URL}/actuator/health" \
            | jq -e '.status == "UP"'

      - name: Publish deployment summary
        shell: bash
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          TASK_DEFINITION_ARN: ${{ steps.task.outputs.arn }}
        run: |
          {
            echo "### Backend DEV desplegado"
            echo
            echo "- Image: \`${IMAGE_URI}\`"
            echo "- Task definition: \`${TASK_DEFINITION_ARN}\`"
            echo "- Service: \`${ECS_SERVICE}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Show ECS diagnostics on failure
        if: failure()
        shell: bash
        run: |
          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --query 'services[0].events[:10]' \
            --output table || true

  # DEV solo verifica el despliegue; el ambiente de uso es TEST.
  # Job aparte: corre completo aunque el deploy falle, se cancele o venza, con
  # su propia sesion OIDC (un paso always() tras cancelar tiene ~5 minutos).
  shutdown:
    name: shutdown-dev-runtime
    needs: [detect, deploy]
    if: always() && needs.detect.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "060712744495"
          mask-aws-account-id: true
          role-session-name: backend-dev-shutdown-${{ github.run_id }}

      - name: Stop DEV runtime
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/aws/runtime.sh stop
          echo "### Runtime DEV apagado: ECS en 0 tareas y RDS detenida" >> "${GITHUB_STEP_SUMMARY}"
