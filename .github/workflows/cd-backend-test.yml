name: Promote backend to AWS TEST

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag inmutable ya publicado en ECR DEV (normalmente el SHA)"
        required: true
        type: string
      confirmation:
        description: "Escribir exactamente DEPLOY_TEST"
        required: true
        type: string

# id-token: write sólo en el job que asume el rol de AWS por OIDC.
permissions:
  contents: read

concurrency:
  group: backend-test
  cancel-in-progress: false

jobs:
  validate:
    name: validate-promotion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
      APPLY_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Validate promotion request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${APPLY_CONFIRMATION}" != "DEPLOY_TEST" ]]; then
            echo "Promotion requires confirmation DEPLOY_TEST."
            exit 1
          fi
          if [[ ! "${REQUESTED_IMAGE_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid ECR image tag."
            exit 1
          fi

  deploy:
    name: promote-backend-test
    permissions:
      contents: read
      id-token: write
    needs: validate
    uses: ./.github/workflows/cd-backend.yml
    with:
      environment: test
      image_tag: ${{ inputs.image_tag }}
