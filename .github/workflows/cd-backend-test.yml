name: Promote backend to AWS TEST

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag inmutable ya publicado en ECR DEV (normalmente el SHA)"
        required: true
        type: string
      confirmation:
        description: "Escribir exactamente DEPLOY_TEST"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-test
  cancel-in-progress: false

jobs:
  deploy:
    name: promote-backend-test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: test

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: "060712744495"
      ECR_REPOSITORY: "modulo-5-rentas-test-backend"
      DEV_ECR_REPOSITORY: "modulo-5-rentas-dev-backend"
      ECS_CLUSTER: "modulo-5-rentas-test-cluster"
      ECS_SERVICE: "modulo-5-rentas-test-backend"
      ECS_TASK_FAMILY: "modulo-5-rentas-test-backend"
      ECS_CONTAINER_NAME: "backend"
      REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
      APPLY_CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate promotion request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${APPLY_CONFIRMATION}" != "DEPLOY_TEST" ]]; then
            echo "Promotion requires confirmation DEPLOY_TEST."
            exit 1
          fi
          if [[ ! "${REQUESTED_IMAGE_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid ECR image tag."
            exit 1
          fi

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "060712744495"
          mask-aws-account-id: true
          role-session-name: backend-test-${{ github.run_id }}

      - name: Check environment variables
        shell: bash
        run: |
          set -euo pipefail
          : "${AWS_REGION:?Missing AWS_REGION in the test environment}"

      - name: Login to Amazon ECR
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login \
                --username AWS \
                --password-stdin \
                "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Promote immutable DEV image to TEST
        id: image
        shell: bash
        run: |
          set -euo pipefail
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          source_image="${registry}/${DEV_ECR_REPOSITORY}:${REQUESTED_IMAGE_TAG}"
          target_image="${registry}/${ECR_REPOSITORY}:${REQUESTED_IMAGE_TAG}"

          source_digest=$(aws ecr describe-images \
            --repository-name "${DEV_ECR_REPOSITORY}" \
            --image-ids imageTag="${REQUESTED_IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          target_digest=$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${REQUESTED_IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2> /dev/null || true)

          if [[ -n "${target_digest}" && "${target_digest}" != "None" ]]; then
            if [[ "${target_digest}" != "${source_digest}" ]]; then
              echo "Immutable TEST tag exists with a different digest."
              exit 1
            fi
            echo "Image already promoted; reusing ${target_image}."
          else
            docker pull "${source_image}"
            docker tag "${source_image}" "${target_image}"
            docker push "${target_image}"
          fi

          echo "uri=${target_image}" >> "${GITHUB_OUTPUT}"

      - name: Register task definition revision
        id: task
        shell: bash
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail

          aws ecs describe-task-definition \
            --task-definition "${ECS_TASK_FAMILY}" \
            --query taskDefinition \
            > "${RUNNER_TEMP}/task-definition.json"

          jq \
            --arg image "${IMAGE_URI}" \
            --arg container "${ECS_CONTAINER_NAME}" \
            'del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            | (.containerDefinitions[] | select(.name == $container).image) = $image' \
            "${RUNNER_TEMP}/task-definition.json" \
            > "${RUNNER_TEMP}/task-definition-rendered.json"

          task_definition_arn=$(aws ecs register-task-definition \
            --cli-input-json "file://${RUNNER_TEMP}/task-definition-rendered.json" \
            --query taskDefinition.taskDefinitionArn \
            --output text)

          echo "arn=${task_definition_arn}" >> "${GITHUB_OUTPUT}"

      - name: Deploy service and wait until stable
        shell: bash
        env:
          TASK_DEFINITION_ARN: ${{ steps.task.outputs.arn }}
        run: |
          set -euo pipefail

          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${TASK_DEFINITION_ARN}" \
            --desired-count 1 \
            --force-new-deployment \
            > /dev/null

          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}"

      - name: Publish deployment summary
        shell: bash
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          TASK_DEFINITION_ARN: ${{ steps.task.outputs.arn }}
        run: |
          {
            echo "### Backend TEST desplegado"
            echo
            echo "- Image: \`${IMAGE_URI}\`"
            echo "- Task definition: \`${TASK_DEFINITION_ARN}\`"
            echo "- Service: \`${ECS_SERVICE}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Show ECS diagnostics on failure
        if: failure()
        shell: bash
        run: |
          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --query 'services[0].events[:10]' \
            --output table || true

