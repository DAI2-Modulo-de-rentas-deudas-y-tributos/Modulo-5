name: Promote frontend to AWS TEST

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "SHA completo (40 caracteres) validado en DEV"
        required: true
        type: string
      confirmation:
        description: "Escribir exactamente DEPLOY_TEST"
        required: true
        type: string

# id-token: write sólo en el job que asume el rol de AWS por OIDC.
permissions:
  contents: read

concurrency:
  group: frontend-test
  cancel-in-progress: false

jobs:
  validate:
    name: validate-promotion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REQUESTED_SOURCE_REF: ${{ inputs.source_ref }}
      APPLY_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Validate promotion request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${APPLY_CONFIRMATION}" != "DEPLOY_TEST" ]]; then
            echo "Promotion requires confirmation DEPLOY_TEST."
            exit 1
          fi
          if [[ ! "${REQUESTED_SOURCE_REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_ref must be a complete 40-character commit SHA."
            exit 1
          fi

  deploy:
    name: promote-frontend-test
    permissions:
      contents: read
      id-token: write
    needs: validate
    uses: ./.github/workflows/cd-frontend.yml
    with:
      environment: test
      amplify_branch: test
      source_ref: ${{ inputs.source_ref }}
