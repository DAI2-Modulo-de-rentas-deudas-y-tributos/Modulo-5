name: Promote frontend to AWS TEST

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "SHA completo (40 caracteres) validado en DEV"
        required: true
        type: string
      confirmation:
        description: "Escribir exactamente DEPLOY_TEST"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-test
  cancel-in-progress: false

jobs:
  deploy:
    name: promote-frontend-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: test

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AMPLIFY_APP_NAME: "modulo-5-rentas-test-frontend"
      AMPLIFY_BRANCH: "test"
      REQUESTED_SOURCE_REF: ${{ inputs.source_ref }}
      APPLY_CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Checkout promoted source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref }}

      - name: Validate promotion request
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${APPLY_CONFIRMATION}" != "DEPLOY_TEST" ]]; then
            echo "Promotion requires confirmation DEPLOY_TEST."
            exit 1
          fi
          if [[ ! "${REQUESTED_SOURCE_REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_ref must be a complete 40-character commit SHA."
            exit 1
          fi
          test -f frontend/package.json
          test -f frontend/package-lock.json
          resolved_sha=$(git rev-parse HEAD)
          if [[ "${resolved_sha,,}" != "${REQUESTED_SOURCE_REF,,}" ]]; then
            echo "Checked out commit does not match source_ref."
            exit 1
          fi
          echo "sha=${resolved_sha}" >> "${GITHUB_OUTPUT}"

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "060712744495"
          mask-aws-account-id: true
          role-session-name: frontend-test-${{ github.run_id }}

      - name: Resolve Amplify configuration
        id: amplify
        shell: bash
        run: |
          set -euo pipefail
          : "${AWS_REGION:?Missing AWS_REGION in the test environment}"

          app_id=$(aws amplify list-apps \
            --query "apps[?name=='${AMPLIFY_APP_NAME}'].appId | [0]" \
            --output text)

          if [[ -z "${app_id}" || "${app_id}" == "None" ]]; then
            echo "Amplify app ${AMPLIFY_APP_NAME} was not found."
            exit 1
          fi

          api_base_url=$(aws amplify get-app \
            --app-id "${app_id}" \
            --query 'app.environmentVariables.VITE_API_BASE_URL' \
            --output text)

          : "${api_base_url:?Amplify app does not expose VITE_API_BASE_URL}"
          echo "app-id=${app_id}" >> "${GITHUB_OUTPUT}"
          echo "api-base-url=${api_base_url}" >> "${GITHUB_OUTPUT}"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend artifact
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ steps.amplify.outputs.api-base-url }}
        run: |
          npm ci
          npm run build

      - name: Package frontend artifact
        shell: bash
        run: |
          set -euo pipefail
          test -d frontend/dist
          pushd frontend/dist > /dev/null
          zip -qr "${RUNNER_TEMP}/frontend-dist.zip" .
          popd > /dev/null

      - name: Deploy artifact to Amplify Hosting
        id: deployment
        shell: bash
        env:
          AMPLIFY_APP_ID: ${{ steps.amplify.outputs.app-id }}
        run: |
          set -euo pipefail

          deployment=$(aws amplify create-deployment \
            --app-id "${AMPLIFY_APP_ID}" \
            --branch-name "${AMPLIFY_BRANCH}")

          job_id=$(jq -r '.jobId' <<< "${deployment}")
          upload_url=$(jq -r '.zipUploadUrl' <<< "${deployment}")

          curl --fail --silent --show-error \
            --request PUT \
            --header "Content-Type: application/zip" \
            --upload-file "${RUNNER_TEMP}/frontend-dist.zip" \
            "${upload_url}"

          aws amplify start-deployment \
            --app-id "${AMPLIFY_APP_ID}" \
            --branch-name "${AMPLIFY_BRANCH}" \
            --job-id "${job_id}" \
            > /dev/null

          for attempt in {1..120}; do
            status=$(aws amplify get-job \
              --app-id "${AMPLIFY_APP_ID}" \
              --branch-name "${AMPLIFY_BRANCH}" \
              --job-id "${job_id}" \
              --query 'job.summary.status' \
              --output text)

            case "${status}" in
              SUCCEED)
                echo "job-id=${job_id}" >> "${GITHUB_OUTPUT}"
                exit 0
                ;;
              FAILED|CANCELLED)
                echo "Amplify deployment ended with status ${status}."
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Amplify deployment timed out."
          exit 1

      - name: Publish deployment summary
        shell: bash
        env:
          AMPLIFY_APP_ID: ${{ steps.amplify.outputs.app-id }}
        run: |
          default_domain=$(aws amplify get-app \
            --app-id "${AMPLIFY_APP_ID}" \
            --query 'app.defaultDomain' \
            --output text)

          {
            echo "### Frontend TEST desplegado"
            echo
            echo "- URL: https://${AMPLIFY_BRANCH}.${default_domain}"
            echo "- Job: \`${{ steps.deployment.outputs.job-id }}\`"
            echo "- Source commit: \`${{ steps.source.outputs.sha }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

