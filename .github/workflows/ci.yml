name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  # cd-prod.yml lo invoca como compuerta antes de desplegar cada commit de main.
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload Sonar inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-frontend
          path: frontend/coverage/lcov.info
          retention-days: 1
          if-no-files-found: error

      - name: Build web application
        run: npm run build

  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rentas
          POSTGRES_USER: rentas
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rentas -d rentas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/rentas
      SPRING_DATASOURCE_USERNAME: rentas

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test and package backend
        run: mvn -B -ntp clean verify --file backend/pom.xml

      - name: Upload Sonar inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-backend
          path: |
            backend/target/classes/
            backend/target/site/jacoco/jacoco.xml
          retention-days: 1
          if-no-files-found: error

      - name: Setup Python for PDF acceptance
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install PDF validation tools
        id: pdf-tools
        run: |
          python -m pip install --only-binary :all: --require-hashes -r scripts/test/requirements.txt
          sudo apt-get update
          sudo apt-get install -y poppler-utils postgresql-client

      - name: Parse PDF evidence and verify acceptance runner
        run: python -m unittest discover -s scripts/test -p 'test_*.py' -v

      - name: Validate PDF and bulk HTTP flows on PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          export RENTAS_SECURITY_DEV_MODE=true
          export RENTAS_DEMO_BOOTSTRAP_PASSWORD="$(openssl rand -hex 32)"
          export TEST_DEMO_USERNAME="qa.ci.supervisor"
          export TEST_DEMO_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::${RENTAS_DEMO_BOOTSTRAP_PASSWORD}"
          echo "::add-mask::${TEST_DEMO_PASSWORD}"
          java -jar backend/target/rentas-backend.jar > "${RUNNER_TEMP}/backend.log" 2>&1 &
          backend_pid=$!
          trap 'kill "${backend_pid}" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/actuator/health > /dev/null; then
              curl --fail --silent http://localhost:8080/api/v1/health \
                | grep --quiet '"status":"UP"'
              break
            fi
            sleep 2
          done

          if ! curl --fail --silent http://localhost:8080/actuator/health > /dev/null; then
            cat "${RUNNER_TEMP}/backend.log"
            exit 1
          fi
          psql \
            --host=127.0.0.1 --username="${SPRING_DATASOURCE_USERNAME}" --dbname=rentas \
            --set=ON_ERROR_STOP=1 --file=scripts/test/seed_bulk_ci.sql
          python scripts/test/aws_test_acceptance.py \
            --api-base-url http://localhost:8080 \
            --scenario pdf \
            --output-dir backend/target/pdf-evidence/http
          for size in 10 50 200; do
            python scripts/test/aws_test_acceptance.py \
              --api-base-url http://localhost:8080 \
              --scenario bulk --bulk-size "${size}" --max-duration-seconds 120 \
              --output-dir "backend/target/bulk-evidence/${size}"
          done

      - name: Render PDF evidence
        # pdftoppm viene de poppler-utils: si los tests fallaron antes de instalarlo,
        # el render solo taparia la falla real con un "command not found".
        if: always() && steps.pdf-tools.outcome == 'success'
        shell: bash
        run: |
          shopt -s nullglob
          for document in backend/target/pdf-evidence/*.pdf backend/target/pdf-evidence/http/*.pdf; do
            pdftoppm -r 90 -png "${document}" "${document%.pdf}"
          done

      - name: Upload PDF and bulk evidence and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: operational-acceptance-${{ github.run_id }}
          path: |
            backend/target/pdf-evidence/
            backend/target/bulk-evidence/
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          retention-days: 7
          if-no-files-found: warn

      - name: Build backend container image
        run: docker build --tag modulo-5-rentas-backend:${{ github.sha }} backend

  # Condición G1: el sistema completo levanta desde un clon limpio siguiendo sólo el README.
  compose:
    name: compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sin .env el arranque se corta con un mensaje claro
        shell: bash
        run: |
          set -euo pipefail
          if docker compose config --quiet 2> "${RUNNER_TEMP}/compose-error.txt"; then
            echo "docker compose config debía fallar sin .env."
            exit 1
          fi
          grep "Falta .* en .env" "${RUNNER_TEMP}/compose-error.txt"

      - name: Completar el .env como indica el README
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          for name in POSTGRES_PASSWORD RABBITMQ_PASSWORD RENTAS_DEMO_BOOTSTRAP_PASSWORD RENTAS_DEMO_USERS_PASSWORD; do
            value="$(openssl rand -hex 16)"
            echo "::add-mask::${value}"
            grep --quiet "^${name}=$" .env
            sed -i "s/^${name}=$/${name}=${value}/" .env
          done

      - name: Levantar el sistema con el comando del README
        run: docker compose up -d --build

      - name: Verificar el sistema como indica el README
        run: sh scripts/compose/smoke-test.sh

      - name: Un segundo arranque reutiliza los datos sin fallar
        run: |
          docker compose up -d
          sh scripts/compose/smoke-test.sh

      - name: Preparar Node para las pruebas E2E
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Playwright
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium

      # Eje A: escenarios críticos de punta a punta, accesibilidad (axe) y responsive (360/768/1280).
      - name: Pruebas E2E con Playwright
        run: sh scripts/compose/e2e-test.sh

      - name: Publicar el reporte de Playwright
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
          if-no-files-found: ignore

      # Eje C: mensaje duplicado, mensaje inválido a la DLQ y broker caído sin perder eventos.
      - name: Pruebas de resiliencia de la mensajería
        run: sh scripts/compose/resilience-test.sh

      # Eje B: todas las operaciones contra el OpenAPI publicado, con datos válidos e inválidos.
      - name: Pruebas de contrato contra el OpenAPI (Schemathesis)
        run: sh scripts/compose/contract-test.sh

      - name: Publicar el reporte de Schemathesis
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: schemathesis-report
          path: schemathesis-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Estado y logs de los servicios
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

  # HU-SEC03 (OWASP A06): dependencias Maven y npm con vulnerabilidades conocidas en OSV.
  # Bloquea cualquier hallazgo nuevo; las excepciones vigentes, con vencimiento, están en
  # backend/osv-scanner.toml y justificadas en docs/security/SCRUM-793_SCA_2026-10-28.md.
  dependency-scan:
    name: dependency-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: OSV-Scanner (backend/pom.xml y frontend/package-lock.json)
        run: |
          docker run --rm --volume "${PWD}:/src:ro" \
            ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0 \
            scan source /src/backend /src/frontend --data-source native --format vertical

  # Condición G6: la cátedra escanea en vivo todo el historial con gitleaks / trufflehog.
  # Se usa la última versión de cada herramienta, como la instalaría alguien hoy. Los hallazgos
  # se publican como anotaciones sin el valor; los falsos positivos están en .gitleaksignore y
  # justificados en docs/security/G6_ESCANEO_SECRETOS.md.
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historial completo de todas las ramas: ambas herramientas recorren `git log --all`.
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks (bloquea cualquier hallazgo nuevo)
        shell: bash
        run: |
          set -euo pipefail
          latest="$(curl --proto '=https' --tlsv1.2 -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/gitleaks/gitleaks/releases/latest)"
          version="${latest##*/v}"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          cd "${RUNNER_TEMP}"
          curl --proto '=https' --tlsv1.2 -fsSLO "${base}/gitleaks_${version}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLO "${base}/gitleaks_${version}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${version}_checksums.txt"
          tar -xzf "gitleaks_${version}_linux_x64.tar.gz" gitleaks
          cd "${GITHUB_WORKSPACE}"

          status=0
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner \
            --report-format json --report-path "${RUNNER_TEMP}/gitleaks.json" . || status=$?
          jq '[.[] | {RuleID, File, Commit, Line: .StartLine, Fingerprint}]' "${RUNNER_TEMP}/gitleaks.json" \
            | jq -r --arg tool "gitleaks ${version}" -f .github/scripts/secret-annotations.jq
          exit "${status}"

      - name: Trufflehog (informativo; resultados no verificados documentados)
        shell: bash
        run: |
          set -euo pipefail
          # trufflehog lee las ramas locales: se crea una por cada rama remota.
          git for-each-ref --format='%(refname:short)' refs/remotes/origin \
            | grep -v -e '^origin$' -e '/HEAD$' \
            | while read -r ref; do git branch --force "${ref#origin/}" "${ref}" 2> /dev/null || true; done

          # Sin verificación: no envía los candidatos a servicios externos para probarlos.
          docker run --rm --user "$(id -u):$(id -g)" --volume "${PWD}:/repo:ro" \
            trufflesecurity/trufflehog:latest git file:///repo \
            --no-verification --no-update --json > "${RUNNER_TEMP}/trufflehog.jsonl"
          jq -s '[.[] | .SourceMetadata.Data.Git as $git | {RuleID: .DetectorName, File: $git.file, Commit: $git.commit, Line: $git.line}]' \
            "${RUNNER_TEMP}/trufflehog.jsonl" \
            | jq -r --arg tool trufflehog -f .github/scripts/secret-annotations.jq

  # No cuelga de ci-required: el Quality Gate lo publica SonarQube Cloud como check propio del PR.
  sonar:
    name: sonar
    needs:
      - frontend
      - backend
    runs-on: ubuntu-latest
    env:
      # Vacío en forks y en la llamada desde cd-prod.yml (no hereda secrets): ahí se omite el análisis.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar necesita el historial completo para detectar el código nuevo.
          fetch-depth: 0
          persist-credentials: false

      - name: Download backend build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-backend
          path: backend/target

      - name: Download frontend coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-frontend
          path: frontend/coverage

      - name: Skip without SONAR_TOKEN
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN no está configurado; se omite el análisis de SonarQube Cloud."

      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"

      - name: Check formatting
        run: terraform fmt -check -recursive infra

      - name: Validate DEV
        working-directory: infra/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate TEST
        working-directory: infra/environments/test
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate PROD
        working-directory: infra/environments/prod
        run: |
          terraform init -backend=false
          terraform validate

  # Único check obligatorio del ruleset: cualquier job que no termine en success (incluido
  # skipped o cancelled) lo hace fallar. Un job nuevo sólo cuenta si se agrega a `needs`.
  ci-required:
    name: ci-required
    if: always()
    needs:
      - frontend
      - backend
      - terraform
      - compose
      - dependency-scan
      - secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "${NEEDS}"
          jq -e 'all(.[]; .result == "success")' <<< "${NEEDS}" > /dev/null
