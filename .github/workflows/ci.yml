name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  application-detection:
    name: application-detection
    runs-on: ubuntu-latest
    outputs:
      frontend-ready: ${{ steps.detect.outputs.frontend-ready }}
      backend-ready: ${{ steps.detect.outputs.backend-ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect application manifests
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          frontend_ready=false
          backend_ready=false

          if [[ -f frontend/package.json ]]; then
            if [[ ! -f frontend/package-lock.json ]]; then
              echo "frontend/package.json exists but package-lock.json is missing."
              exit 1
            fi
            frontend_ready=true
          fi

          if [[ -f backend/pom.xml ]]; then
            backend_ready=true
          fi

          echo "frontend-ready=${frontend_ready}" >> "${GITHUB_OUTPUT}"
          echo "backend-ready=${backend_ready}" >> "${GITHUB_OUTPUT}"
          echo "Frontend ready: ${frontend_ready}"
          echo "Backend ready: ${backend_ready}"

  repository-structure:
    name: repository-structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate DevOps paths
        shell: bash
        run: |
          set -euo pipefail
          test -d frontend
          test -d backend
          test -f backend/Dockerfile
          test -f compose.yaml
          test -f amplify.yml
          test -d contracts
          test -d infra/environments/dev
          test -d infra/environments/test
          test -d docs/adr

  frontend:
    name: frontend
    needs: application-detection
    if: needs.application-detection.outputs.frontend-ready == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web application
        run: npm run build

  backend:
    name: backend
    needs: application-detection
    if: needs.application-detection.outputs.backend-ready == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rentas
          POSTGRES_USER: rentas
          POSTGRES_PASSWORD: rentas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rentas -d rentas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/rentas
      SPRING_DATASOURCE_USERNAME: rentas
      SPRING_DATASOURCE_PASSWORD: rentas_ci
      APP_MODE: api

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test and package backend
        run: mvn -B -ntp clean verify --file backend/pom.xml

      - name: Setup Python for PDF acceptance
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PDF validation tools
        run: |
          python -m pip install -r scripts/test/requirements.txt
          sudo apt-get update
          sudo apt-get install -y poppler-utils postgresql-client

      - name: Parse PDF evidence and verify acceptance runner
        run: python -m unittest discover -s scripts/test -p 'test_*.py' -v

      - name: Validate PDF and bulk HTTP flows on PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          SPRING_PROFILES_ACTIVE=dev java -jar backend/target/rentas-backend.jar > "${RUNNER_TEMP}/backend.log" 2>&1 &
          backend_pid=$!
          trap 'kill "${backend_pid}" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/actuator/health > /dev/null; then
              curl --fail --silent http://localhost:8080/api/v1/health \
                | grep --quiet '"status":"UP"'
              break
            fi
            sleep 2
          done

          if ! curl --fail --silent http://localhost:8080/actuator/health > /dev/null; then
            cat "${RUNNER_TEMP}/backend.log"
            exit 1
          fi
          python scripts/test/aws_test_acceptance.py \
            --api-base-url http://localhost:8080 \
            --scenario pdf \
            --output-dir backend/target/pdf-evidence/http
          PGPASSWORD="${SPRING_DATASOURCE_PASSWORD}" psql \
            --host=127.0.0.1 --username="${SPRING_DATASOURCE_USERNAME}" --dbname=rentas \
            --set=ON_ERROR_STOP=1 --file=scripts/test/seed_bulk_ci.sql
          for size in 10 50 200; do
            python scripts/test/aws_test_acceptance.py \
              --api-base-url http://localhost:8080 \
              --scenario bulk --bulk-size "${size}" --max-duration-seconds 120 \
              --output-dir "backend/target/bulk-evidence/${size}"
          done

      - name: Render PDF evidence
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          for document in backend/target/pdf-evidence/*.pdf backend/target/pdf-evidence/http/*.pdf; do
            pdftoppm -r 90 -png "${document}" "${document%.pdf}"
          done

      - name: Upload PDF and bulk evidence and test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: operational-acceptance-${{ github.run_id }}
          path: |
            backend/target/pdf-evidence/
            backend/target/bulk-evidence/
            backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn

      - name: Build backend container image
        run: docker build --tag modulo-5-rentas-backend:${{ github.sha }} backend

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Check formatting
        run: terraform fmt -check -recursive infra

      - name: Validate DEV
        working-directory: infra/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate TEST
        working-directory: infra/environments/test
        run: |
          terraform init -backend=false
          terraform validate

  ci-required:
    name: ci-required
    if: always()
    needs:
      - application-detection
      - repository-structure
      - frontend
      - backend
      - terraform
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        shell: bash
        env:
          DETECTION_RESULT: ${{ needs.application-detection.result }}
          STRUCTURE_RESULT: ${{ needs.repository-structure.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
        run: |
          set -euo pipefail

          if [[ "$DETECTION_RESULT" != "success" \
            || "$STRUCTURE_RESULT" != "success" \
            || "$TERRAFORM_RESULT" != "success" ]]; then
            echo "A required DevOps check failed."
            exit 1
          fi

          if [[ "$FRONTEND_RESULT" != "success" && "$FRONTEND_RESULT" != "skipped" ]]; then
            echo "Frontend CI failed."
            exit 1
          fi

          if [[ "$BACKEND_RESULT" != "success" && "$BACKEND_RESULT" != "skipped" ]]; then
            echo "Backend CI failed."
            exit 1
          fi
