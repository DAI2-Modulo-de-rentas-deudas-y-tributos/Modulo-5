name: Pruebas no funcionales

# Carga con k6 (Eje C: 50 usuarios durante 5 minutos, p95 < 500 ms y < 1 % de errores) y escaneo
# OWASP ZAP (Eje D: baseline del portal y activo autenticado de la API, 0 alertas High) sobre el
# sistema de docker compose. Tardan demasiado para cada PR: corren semanalmente, al crear un tag
# de release y a pedido. Los reportes quedan como artefactos.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1" # lunes 04:00 (Argentina)
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  carga:
    name: carga (k6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Levantar el sistema
        run: |
          sh scripts/compose/ci-env.sh
          docker compose up -d --build
          sh scripts/compose/smoke-test.sh

      - name: k6 sobre los 3 endpoints críticos
        run: sh scripts/compose/load-test.sh

      - name: Publicar el reporte de k6
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k6-report
          path: k6-report
          retention-days: 30
          if-no-files-found: ignore
