name: Secret scan

# Condición G6: la cátedra escanea en vivo todo el historial con gitleaks / trufflehog.
# Se usa la última versión de cada herramienta, como la instalaría alguien hoy.
# Todavía no cuelga de ci-required: primero hay que resolver lo que detecte en el historial.
# Los hallazgos se publican como anotaciones, sin el valor del secreto.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Historial completo de todas las ramas: gitleaks recorre `git log --all`.
          fetch-depth: 0
          persist-credentials: false

      - name: Escanear el historial
        shell: bash
        run: |
          set -euo pipefail
          latest="$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/gitleaks/gitleaks/releases/latest)"
          version="${latest##*/v}"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          cd "${RUNNER_TEMP}"
          curl -fsSLO "${base}/gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSLO "${base}/gitleaks_${version}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${version}_checksums.txt"
          tar -xzf "gitleaks_${version}_linux_x64.tar.gz" gitleaks
          cd "${GITHUB_WORKSPACE}"

          status=0
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner \
            --report-format json --report-path "${RUNNER_TEMP}/gitleaks.json" . || status=$?
          jq -r --arg tool "gitleaks ${version}" -f .github/scripts/secret-annotations.jq "${RUNNER_TEMP}/gitleaks.json"
          exit "${status}"

  trufflehog:
    name: trufflehog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Escanear el historial
        shell: bash
        run: |
          set -euo pipefail
          # trufflehog lee las ramas locales: se crea una por cada rama remota.
          git for-each-ref --format='%(refname:short)' refs/remotes/origin \
            | grep -v -e '^origin$' -e '/HEAD$' \
            | while read -r ref; do git branch --force "${ref#origin/}" "${ref}" 2> /dev/null || true; done

          status=0
          # Sin verificación: no envía los candidatos a los servicios externos para probarlos.
          docker run --rm --user "$(id -u):$(id -g)" --volume "${PWD}:/repo:ro" \
            trufflesecurity/trufflehog:latest git file:///repo \
            --no-verification --no-update --json --fail > "${RUNNER_TEMP}/trufflehog.jsonl" || status=$?
          jq -s '[.[] | {RuleID: .DetectorName, File: .SourceMetadata.Data.Git.file, Commit: .SourceMetadata.Data.Git.commit}]' \
            "${RUNNER_TEMP}/trufflehog.jsonl" \
            | jq -r --arg tool trufflehog -f .github/scripts/secret-annotations.jq
          exit "${status}"
