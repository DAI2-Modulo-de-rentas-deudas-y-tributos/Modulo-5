services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rentas}
      POSTGRES_USER: ${POSTGRES_USER:-rentas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env o en el entorno}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["rentas_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rentas} -d ${POSTGRES_DB:-rentas}"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: .
    profiles: ["full"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rentas}
      DB_USER: ${POSTGRES_USER:-rentas}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env o en el entorno}
      BROKER_ADAPTER: ${BROKER_ADAPTER:-local-log}
      OUTBOX_DELAY_MS: ${OUTBOX_DELAY_MS:-5000}
    ports: ["${SERVER_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      postgres: { condition: service_healthy }
volumes:
  rentas_postgres:
