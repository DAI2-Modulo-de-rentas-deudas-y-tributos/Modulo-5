spring:
  application:
    name: rentas-m5
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rentas}
    username: ${DB_USER:rentas}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: never
springdoc:
  swagger-ui.path: /swagger-ui.html
  api-docs.path: /v3/api-docs
rentas:
  broker-adapter: ${BROKER_ADAPTER:local-log}
  outbox-delay-ms: ${OUTBOX_DELAY_MS:5000}
  security.dev-mode: ${RENTAS_SECURITY_DEV_MODE:false}
  security.demo-bootstrap-password: ${RENTAS_DEMO_BOOTSTRAP_PASSWORD:}
