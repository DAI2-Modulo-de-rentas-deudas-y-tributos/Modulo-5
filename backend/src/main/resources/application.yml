spring:
  application:
    name: rentas-m5
  data:
    web:
      pageable:
        max-page-size: 100
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rentas}
    username: ${DB_USER:rentas}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/migration-postgresql
  rabbitmq:
    host: ${CORE_RABBITMQ_HOST:localhost}
    port: ${CORE_RABBITMQ_PORT:5672}
    username: ${CORE_RABBITMQ_USERNAME:}
    password: ${CORE_RABBITMQ_PASSWORD:}
    virtual-host: ${CORE_RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template.mandatory: true
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: never
  health.rabbit.enabled: ${CORE_RABBITMQ_HEALTH_ENABLED:false}
springdoc:
  swagger-ui.path: /swagger-ui.html
  api-docs.path: /v3/api-docs
rentas:
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  broker-adapter: ${BROKER_ADAPTER:local-log}
  core.amqp.exchange: ${CORE_RABBITMQ_EXCHANGE:muni.inbox}
  core.amqp.queue: ${CORE_RABBITMQ_QUEUE:q.rentas}
  core.amqp.confirm-timeout: ${CORE_RABBITMQ_CONFIRM_TIMEOUT:5s}
  core.amqp.consumer-enabled: ${CORE_RABBITMQ_CONSUMER_ENABLED:false}
  outbox-delay-ms: ${OUTBOX_DELAY_MS:5000}
  security.dev-mode: ${RENTAS_SECURITY_DEV_MODE:false}
  security.demo-bootstrap-password: ${RENTAS_DEMO_BOOTSTRAP_PASSWORD:}
  security.demo-session-ttl: ${RENTAS_DEMO_SESSION_TTL:PT8H}
