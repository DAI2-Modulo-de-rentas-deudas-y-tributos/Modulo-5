services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rentas}
      POSTGRES_USER: ${POSTGRES_USER:-rentas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentas_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rentas} -d ${POSTGRES_DB:-rentas}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    profiles:
      - application
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rentas}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-rentas}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-rentas_local}
      APP_MODE: api
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4173}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
