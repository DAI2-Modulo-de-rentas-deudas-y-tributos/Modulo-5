# SonarQube Cloud (https://sonarcloud.io). El análisis corre en el job `sonar` de ci.yml,
# así que el proyecto tiene que tener desactivado "Automatic Analysis".
# Claves: confirmarlas en la página "Information" del proyecto después de importarlo.
sonar.organization=dai2-modulo-de-rentas-deudas-y-tributos
sonar.projectKey=DAI2-Modulo-de-rentas-deudas-y-tributos_Modulo-5
sonar.sourceEncoding=UTF-8

sonar.sources=frontend/src,backend/src/main,infra,.github
sonar.tests=frontend/src,backend/src/test
# En el frontend el código y los tests conviven en src/.
sonar.exclusions=frontend/src/**/*.test.*,frontend/src/**/*.spec.*,frontend/src/__tests__/**,frontend/src/test/**
sonar.test.inclusions=frontend/src/**/*.test.*,frontend/src/**/*.spec.*,frontend/src/__tests__/**,frontend/src/test/**,backend/src/test/**

sonar.java.binaries=backend/target/classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# ponytail: el frontend queda fuera de la cobertura hasta que el CI genere
# frontend/coverage/lcov.info (llega con la PR #86). Entonces reemplazar esta línea por
# sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.coverage.exclusions=frontend/**
